<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Basics :: kernel quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFBF6;
    --cell:#FFFFFF;
    --line:#E4E1D6;
    --ink:#22261F;
    --ink-soft:#5B6157;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
    --jupy:#F37626;
    --jupy-dim:#FCE2CC;
    --good:#2E7D32;
    --good-bg:#E9F3EA;
    --bad:#B3261E;
    --bad-bg:#FBEAE9;
    --blue:#2F6FA8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:960px;margin:0 auto;padding:36px 24px 70px;font-size:17px;}

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid var(--line);border-radius:6px 6px 0 0;
    background:var(--cell);padding:10px 16px;
  }
  .toolbar-left{display:flex;align-items:center;gap:10px;}
  .badge{
    width:9px;height:9px;border-radius:50%;background:var(--jupy);
    box-shadow:0 0 0 3px var(--jupy-dim);
  }
  .badge.busy{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .toolbar-title{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink);}
  .toolbar-right{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}

  .notebook{
    border:1px solid var(--line);border-top:none;
    background:var(--cell);border-radius:0 0 6px 6px;
    padding:0;overflow:hidden;
  }

  .intro{padding:44px 40px 48px;}
  .intro h1{font-size:28px;font-weight:600;margin:0 0 10px;font-family:var(--sans);}
  .intro p{font-size:16.5px;line-height:1.7;color:var(--ink-soft);margin:0 0 18px;}
  .intro-meta{
    display:flex;gap:22px;margin:24px 0 30px;flex-wrap:wrap;
  }
  .meta-chip{
    font-family:var(--mono);font-size:14px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:6px;padding:9px 14px;
    background:var(--paper);
  }
  .meta-chip b{color:var(--ink);font-weight:600;}
  .item-preview{
    display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px;
  }
  .item-chip{
    font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--line);
    border-radius:5px;padding:5px 10px;
  }
  .run-btn{
    font-family:var(--mono);font-size:16px;font-weight:500;
    background:var(--ink);color:#fff;border:none;border-radius:6px;
    padding:15px 28px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  }
  .run-btn:hover{background:#3a3f34;}
  .run-btn .tri{
    width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-left:9px solid var(--jupy);
  }

  .quiz-col{padding:38px 40px 42px;}

  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .progress-txt{font-family:var(--mono);font-size:14px;color:var(--ink-soft);}
  .progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1;margin-left:16px;}
  .progress-fill{height:100%;background:var(--jupy);width:0%;transition:width .25s ease;}

  .cell-in{
    font-family:var(--mono);font-size:14px;color:var(--blue);margin-bottom:10px;
  }
  .question{
    font-family:var(--mono);font-size:16.5px;line-height:1.65;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:20px 22px;margin-bottom:26px;white-space:pre-wrap;
  }

  .options{display:flex;flex-direction:column;gap:11px;}
  .option{
    text-align:left;font-family:var(--mono);font-size:16px;color:var(--ink);
    background:var(--cell);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px;cursor:pointer;transition:border-color .12s, background .12s;
  }
  .option:hover{border-color:var(--ink-soft);}
  .option .idx{color:var(--ink-soft);margin-right:10px;}
  .option:disabled{cursor:default;}
  .option.picked-ok{background:var(--good-bg);border-color:var(--good);}
  .option.picked-bad{background:var(--bad-bg);border-color:var(--bad);}
  .option.reveal-ok{border-color:var(--good);}

  .answer-panel{
    margin-top:16px;border-radius:6px;padding:16px 18px;font-size:15px;line-height:1.6;
  }
  .answer-panel.ok{background:var(--good-bg);border:1px solid var(--good);}
  .answer-panel.bad{background:var(--bad-bg);border:1px solid var(--bad);}
  .answer-panel .verdict{font-family:var(--mono);font-weight:600;margin-bottom:6px;}
  .answer-panel.ok .verdict{color:var(--good);}
  .answer-panel.bad .verdict{color:var(--bad);}
  .answer-panel .why{color:var(--ink-soft);}

  .next-row{display:flex;justify-content:flex-end;margin-top:22px;}
  .next-btn{
    font-family:var(--mono);font-size:15px;background:var(--ink);color:#fff;
    border:none;border-radius:6px;padding:13px 24px;cursor:pointer;
  }
  .next-btn:hover{background:#3a3f34;}
  .next-btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}

  .report{padding:42px 40px 14px;}
  .report h2{font-size:26px;font-weight:600;margin:0 0 6px;}
  .report .sub{font-size:16px;color:var(--ink-soft);margin:0 0 28px;}
  .score-row{display:flex;gap:18px;margin-bottom:32px;flex-wrap:wrap;}
  .score-card{
    flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);
    border-radius:8px;padding:18px 20px;
  }
  .score-card .num{font-family:var(--mono);font-size:32px;font-weight:700;}
  .score-card .lbl{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .score-card.ok .num{color:var(--good);}
  .score-card.bad .num{color:var(--bad);}

  .section-lbl{
    font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-soft);margin:30px 0 14px;border-top:1px solid var(--line);padding-top:24px;
  }
  .traceback{
    background:#1E1F1C;color:#F2E9DC;border-radius:8px;padding:18px 20px;margin-bottom:16px;
    font-family:var(--mono);font-size:14px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;
  }
  .traceback .tb-head{color:#F2A65A;}
  .traceback .tb-file{color:#8FBF7F;}
  .traceback .tb-line{color:#E7E2D6;}
  .traceback .tb-err{color:#F08B87;font-weight:700;}
  .traceback .tb-why{color:#9FB3D6;margin-top:10px;display:block;}

  .mastery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
  .mastery-item{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:14px;border:1px solid var(--line);
    border-radius:6px;padding:10px 14px;background:var(--paper);
  }
  .mastery-item .frac{color:var(--ink-soft);}
  .mastery-item.full .frac{color:var(--good);}
  .mastery-item.zero .frac{color:var(--bad);}

  .restart-row{display:flex;justify-content:center;margin:36px 0 8px;}
  .restart-btn{
    font-family:var(--mono);font-size:15px;background:transparent;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:13px 26px;cursor:pointer;
  }
  .restart-btn:hover{border-color:var(--ink-soft);}

  .credits{
    text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink-soft);
    padding:18px 0 4px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ITEMS = [
  "Python","Interpreter","Indentation","Variable","Syntax error","Runtime error",
  "List","Tuple","Dictionary","Set","String","Loop","Boolean","Comparison operator",
  "Logical operator","Indexing","NumPy","Pandas","Matplotlib","Seaborn","Scikit-learn",
  "Data Science","Function","Parameter","Argument","Return statement","Module","Package",
  "Exception","math module"
];

const QUESTIONS = [
{item:"Python",q:"What is Python?",opts:["A compiled, low-level systems language","A high-level, interpreted, general-purpose programming language","A markup language for web pages","A database query language"],c:1,exp:"Python is high-level, interpreted, and general-purpose, designed for readability."},
{item:"Python",q:"Which is a real advantage of Python commonly cited in intro courses?",opts:["Extremely verbose syntax","Easy to read and write, with a large ecosystem of libraries","Requires manual memory management","Cannot run on Windows"],c:1,exp:"Python's readable syntax and huge library ecosystem are its most cited advantages."},
{item:"Python",q:"Why is Python popular in Data Science?",opts:["It has built-in spreadsheet software","Libraries like Pandas and NumPy make data analysis simple, and the syntax is easy to learn","It only runs inside Excel","It is the fastest language for numeric loops"],c:1,exp:"Python's approachable syntax plus mature libraries like Pandas and NumPy make it a favorite for data work, even though it isn't the fastest language."},
{item:"Interpreter",q:"Why is Python called an interpreted language?",opts:["Because it is translated into machine code once, ahead of time, then run","Because an interpreter executes the code directly, statement by statement, without a separate compile step","Because it can only run inside an interpreter app, never a script","Because it interprets human speech"],c:1,exp:"An interpreter reads and runs code line by line, rather than compiling the whole program into machine code first."},
{item:"Interpreter",q:"What must be installed to actually run a .py file?",opts:["A web browser","A Python interpreter","A spreadsheet program","A word processor"],c:1,exp:"Running Python code requires an installed interpreter, such as CPython."},
{item:"Indentation",q:"What is the purpose of indentation in Python?",opts:["Purely cosmetic, it has no effect on the program","It defines which lines belong to the same block of code","It makes the file smaller","It marks comments"],c:1,exp:"Indentation is how Python groups statements into blocks — it is functional, not just style."},
{item:"Indentation",q:"What is the purpose of the colon at the end of a line like \"if x > 5:\"?",opts:["It ends the program","It signals that an indented block follows","It is a typo Python ignores","It declares a variable"],c:1,exp:"A colon introduces the indented block that belongs to that if, for, while, or def statement."},
{item:"Indentation",q:"Predict the result.\n\nif 4 > 2:\nprint(\"yes\")",opts:["yes","nothing is printed","IndentationError","SyntaxError caused by a missing colon"],c:2,exp:"The if line correctly ends with a colon, but the body underneath isn't indented, which raises an IndentationError."},
{item:"Variable",q:"Does Python require you to declare a variable's type before use?",opts:["Yes, always with a type keyword","No, Python uses dynamic typing and infers the type from the value","Only for numbers","Only inside functions"],c:1,exp:"Python figures out a variable's type from the value assigned, so no explicit type declaration is required."},
{item:"Variable",q:"Predict the output.\n\nx = 5\nx = \"five\"\nprint(x)",opts:["5","five","Error, x already has a type","SyntaxError"],c:1,exp:"Because Python is dynamically typed, x can be reassigned to a different type; the final value, \"five\", is what prints."},
{item:"Syntax error",q:"What is a syntax error?",opts:["A mistake in the grammar or structure of the code that prevents it from running at all","An error that only appears while correctly formatted code is running","A warning that doesn't stop execution","A logic mistake that gives the wrong answer but still runs"],c:0,exp:"A syntax error breaks Python's grammar rules, so the interpreter can't even start running the code."},
{item:"Syntax error",q:"Which of these lines contains a syntax error?\n\nif x == 5\n    print(x)",opts:["The comparison == is invalid","The line is missing a colon after the condition","print(x) is spelled wrong","x was never a valid variable name"],c:1,exp:"An if statement must end with a colon; without it, Python raises a SyntaxError before the program can run."},
{item:"Syntax error",q:"Predict the result.\n\nnumbers = (1, 2, 3)\nnumbers.append(4)",opts:["numbers becomes (1, 2, 3, 4)","Nothing happens","AttributeError, because tuples have no append() method","SyntaxError"],c:2,exp:"Tuples are immutable and don't support append(); calling it raises an AttributeError, which is a runtime error, not a syntax error."},
{item:"Runtime error",q:"What is a runtime error?",opts:["A mistake caught before the program ever starts running","An error that occurs while a syntactically correct program is executing","A missing colon","A misspelled keyword"],c:1,exp:"Runtime errors happen during execution, after the code has already passed Python's syntax check."},
{item:"Runtime error",q:"Predict the output.\n\nx = 5\ny = 0\nprint(x / y)",opts:["0","Infinity","ZeroDivisionError","SyntaxError"],c:2,exp:"Dividing by zero is valid syntax but fails during execution, raising a ZeroDivisionError, a runtime error."},
{item:"Runtime error",q:"Which best distinguishes a syntax error from a runtime error?",opts:["Syntax errors happen while running; runtime errors happen before running","Syntax errors are caught before execution begins; runtime errors occur while the program is executing","They are the same thing","Only runtime errors can be fixed"],c:1,exp:"Syntax errors block the program from starting at all, while runtime errors surface once correctly structured code actually runs."},
{item:"List",q:"Which structure is written with square brackets and can be changed after creation?",opts:["Tuple","List","Set","None of these"],c:1,exp:"A list is an ordered, mutable sequence written with square brackets."},
{item:"List",q:"Predict the output.\n\nnumbers = [5, 4, 3]\nnumbers.append(2)\nprint(numbers)",opts:["[5, 4, 3]","[5, 4, 3, 2]","[2, 5, 4, 3]","Error"],c:1,exp:"append() adds 2 to the end of the list, giving [5, 4, 3, 2]."},
{item:"List",q:"You need to store a changing list of employee names where order matters and duplicates are fine. Which structure fits best?",opts:["Tuple","List","Set","Dictionary"],c:1,exp:"A list is ordered, mutable, and allows duplicates, which fits a changing roster of names."},
{item:"List",q:"Predict the output.\n\nnums = [10, 20, 30]\nnums.remove(20)\nprint(nums)",opts:["[10, 30]","[10, 20]","[20, 30]","Error"],c:0,exp:"remove() deletes the first matching value, 20, leaving [10, 30]."},
{item:"List",q:"What does len(numbers) return for numbers = [5, 4, 3]?",opts:["3","5","12","Error"],c:0,exp:"len() counts the elements in the list, and there are three."},
{item:"List",q:"Predict the output.\n\nnumbers = [1, 2, 3]\nnumbers.sort(reverse=True)\nprint(numbers)",opts:["[1, 2, 3]","[3, 2, 1]","Error","None"],c:1,exp:"sort(reverse=True) sorts the list in descending order, giving [3, 2, 1]."},
{item:"Tuple",q:"Which structure is ordered but cannot be modified after creation?",opts:["List","Tuple","Set","Dictionary"],c:1,exp:"A tuple keeps its order like a list but is immutable once created."},
{item:"Tuple",q:"You need to store GPS coordinates (latitude, longitude) that should never change. Which structure fits best?",opts:["List","Tuple","Set","Dictionary"],c:1,exp:"A tuple's immutability fits fixed, unchanging pairs of values like coordinates."},
{item:"Tuple",q:"Predict the result.\n\npoint = (3, 4)\npoint[0] = 9",opts:["(9, 4)","(3, 4)","TypeError, tuples don't support item assignment","SyntaxError"],c:2,exp:"Tuples are immutable, so attempting to assign to an index raises a TypeError at runtime."},
{item:"Tuple",q:"Which statement correctly differentiates a list and a tuple?",opts:["Lists use () and tuples use []","Lists are mutable and tuples are immutable, though both keep order","Tuples can hold duplicate values but lists cannot","There is no real difference"],c:1,exp:"Both are ordered sequences, but lists can be changed after creation while tuples cannot."},
{item:"Dictionary",q:"Which structure stores data as key-value pairs?",opts:["List","Tuple","Set","Dictionary"],c:3,exp:"A dictionary maps keys to values, written as {key: value, ...}."},
{item:"Dictionary",q:"You need to store an employee's information, like name, age, and salary, together as labeled fields. Which structure fits best?",opts:["List","Tuple","Set","Dictionary"],c:3,exp:"A dictionary lets you label each piece of data with a key, like \"name\" or \"salary\", which fits structured employee info well."},
{item:"Dictionary",q:"Predict the output.\n\nperson = {\"name\": \"Ana\", \"age\": 21}\nprint(person[\"name\"])",opts:["name","Ana","{\"name\": \"Ana\"}","KeyError"],c:1,exp:"Indexing a dictionary with a key returns its associated value, \"Ana\"."},
{item:"Dictionary",q:"Predict the output.\n\nperson = {\"name\": \"Ana\"}\nprint(person[\"age\"])",opts:["None","Ana","KeyError","0"],c:2,exp:"\"age\" was never added as a key, so accessing it raises a KeyError."},
{item:"Set",q:"Which structure automatically removes duplicate values?",opts:["List","Tuple","Set","Dictionary"],c:2,exp:"A set stores only unique values, discarding duplicates automatically."},
{item:"Set",q:"Predict the output.\n\nvalues = {1, 2, 2, 3}\nprint(len(values))",opts:["4","3","2","Error"],c:1,exp:"A set stores only unique values, so the duplicate 2 is dropped, leaving three elements."},
{item:"String",q:"Predict the output.\n\nname = \"python\"\nprint(name.upper())",opts:["python","PYTHON","Python","Error"],c:1,exp:".upper() returns a new string with every character converted to uppercase."},
{item:"String",q:"Predict the output.\n\ntext = \"a,b,c\"\nprint(text.split(\",\"))",opts:["\"a,b,c\"","['a', 'b', 'c']","a b c","Error"],c:1,exp:"split(\",\") breaks the string apart at every comma, returning a list of the pieces."},
{item:"String",q:"Predict the output.\n\nprint(len(\"Data Science\"))",opts:["11","12","13","Error, len() doesn't work on strings"],c:1,exp:"\"Data Science\" has 12 characters, including the space, so len() returns 12."},
{item:"String",q:"What does \"Hello\".replace(\"H\", \"J\") return?",opts:["Hello","Jello","HJello","Error"],c:1,exp:"replace() swaps every occurrence of \"H\" with \"J\", turning \"Hello\" into \"Jello\"."},
{item:"Loop",q:"Predict the output.\n\nfor i in range(3):\n    print(i)",opts:["1 2 3","0 1 2","0 1 2 3","3 2 1"],c:1,exp:"range(3) produces 0, 1, 2; range stops before reaching the given number."},
{item:"Loop",q:"Predict the output.\n\ni = 0\nwhile i < 3:\n    print(i)\n    i += 1",opts:["0 1 2","1 2 3","Infinite loop","0 1 2 3"],c:0,exp:"The loop prints i, then increments it, stopping once i reaches 3, printing 0, 1, 2."},
{item:"Loop",q:"What is the main difference between a for loop and a while loop in Python?",opts:["for loops cannot use range()","A for loop typically iterates over a known sequence, while a while loop repeats as long as a condition is true","while loops always run exactly once","They are identical in every way"],c:1,exp:"for is suited to iterating over a known sequence or range, while while repeats based on a condition being true."},
{item:"Loop",q:"What happens if the condition in a while loop never becomes false?",opts:["Python automatically stops it after 10 iterations","It becomes an infinite loop","SyntaxError","It runs once and exits"],c:1,exp:"A while loop keeps running as long as its condition stays true, so a condition that never turns false creates an infinite loop."},
{item:"Boolean",q:"Predict the output.\n\na = 10\nprint(a > 5)",opts:["10","True","False","Error"],c:1,exp:"10 > 5 is a true comparison, so Python evaluates it to the boolean True."},
{item:"Boolean",q:"Which are the only two values a boolean can hold in Python?",opts:["0 and 1","Yes and No","True and False","On and Off"],c:2,exp:"Python's bool type has exactly two values: True and False."},
{item:"Comparison operator",q:"What does the operator != check for?",opts:["Equal to","Not equal to","Greater than","Less than or equal to"],c:1,exp:"!= tests whether two values are not equal."},
{item:"Comparison operator",q:"Predict the output.\n\nprint(7 >= 7)",opts:["True","False","7","Error"],c:0,exp:">= means greater than or equal to, and 7 is equal to 7, so the result is True."},
{item:"Comparison operator",q:"Predict the output.\n\nprint(5 == \"5\")",opts:["True","False","5","Error"],c:1,exp:"== compares both value and type; an int and a string are never equal, so this is False."},
{item:"Logical operator",q:"Predict the output.\n\nprint(True and False)",opts:["True","False","Error","None"],c:1,exp:"and only returns True if both sides are true; here one side is False, so the result is False."},
{item:"Logical operator",q:"Predict the output.\n\nprint(True or False)",opts:["True","False","Error","None"],c:0,exp:"or returns True if at least one side is true, which is the case here."},
{item:"Logical operator",q:"What does the not operator do?",opts:["Combines two conditions","Reverses a boolean value","Compares two values","Repeats a loop"],c:1,exp:"not flips True to False and False to True."},
{item:"Indexing",q:"Predict the output.\n\nnumbers = [10, 20, 30]\nprint(numbers[0])",opts:["10","20","30","Error"],c:0,exp:"Python indexing starts at 0, so numbers[0] is the first element, 10."},
{item:"Indexing",q:"Predict the output.\n\nnumbers = [10, 20, 30]\nprint(numbers[-1])",opts:["10","30","Error","None"],c:1,exp:"A negative index counts from the end, so -1 refers to the last element, 30."},
{item:"Indexing",q:"Predict the output.\n\nnumbers = [10, 20, 30]\nprint(numbers[5])",opts:["None","0","IndexError","SyntaxError"],c:2,exp:"Index 5 is out of range for a 3-element list, which raises an IndexError at runtime."},
{item:"NumPy",q:"Which library would you use for fast numerical array computation?",opts:["Pandas","NumPy","Matplotlib","Seaborn"],c:1,exp:"NumPy provides fast array operations and underlies much of Python's numerical computing."},
{item:"NumPy",q:"What is NumPy's core data structure?",opts:["DataFrame","ndarray","Series","Table"],c:1,exp:"NumPy centers on the ndarray, an efficient multidimensional array type."},
{item:"Pandas",q:"You have a dataset with columns Age, Salary, and Height. Which library would you use to analyze it?",opts:["Matplotlib","Pandas","Seaborn","math"],c:1,exp:"Pandas is built for working with structured, tabular data like columns of Age, Salary, and Height."},
{item:"Pandas",q:"What is Pandas mainly used for?",opts:["Data analysis and manipulation of tabular data","Drawing charts only","Machine learning models","Solving math equations"],c:0,exp:"Pandas provides DataFrame and Series structures for cleaning, exploring, and analyzing tabular data."},
{item:"Pandas",q:"What is the name of Pandas' main two-dimensional data structure?",opts:["Array","DataFrame","Table","Grid"],c:1,exp:"A DataFrame is Pandas' labeled, two-dimensional table structure."},
{item:"Matplotlib",q:"Which library is used to create charts and plots in Python?",opts:["NumPy","Matplotlib","Pandas","math"],c:1,exp:"Matplotlib is Python's standard library for producing visual charts and graphs."},
{item:"Matplotlib",q:"Which task is Matplotlib best suited for?",opts:["Cleaning messy data","Visualizing data with charts and graphs","Handling exceptions","Machine learning classification"],c:1,exp:"Matplotlib specializes in turning data into visual charts and graphs."},
{item:"Seaborn",q:"What is Seaborn primarily used for?",opts:["Numerical array computation","Statistical data visualization built on top of Matplotlib","Web development","Package installation"],c:1,exp:"Seaborn adds statistical plotting features on top of Matplotlib, making attractive charts easier to build."},
{item:"Seaborn",q:"Which library would best suit creating a statistical graph like a heatmap of correlations?",opts:["Seaborn","math","pip","Scikit-learn"],c:0,exp:"Seaborn specializes in statistical graphics such as heatmaps and distribution plots."},
{item:"Scikit-learn",q:"Which library provides ready-made machine learning models, like classification and regression?",opts:["Matplotlib","Scikit-learn","Pandas","NumPy"],c:1,exp:"Scikit-learn offers ready-made implementations of common machine learning algorithms."},
{item:"Scikit-learn",q:"What kind of task is Scikit-learn built for?",opts:["Reading spreadsheets","Machine learning tasks like classification, regression, and clustering","Only drawing bar charts","Handling exceptions"],c:1,exp:"Scikit-learn packages common machine learning algorithms for classification, regression, and clustering."},
{item:"Data Science",q:"Which library is used for Data Analysis?",opts:["Pandas","Matplotlib","Seaborn","Scikit-learn"],c:0,exp:"Pandas is the standard library for analyzing and manipulating tabular data."},
{item:"Data Science",q:"Which library is used for Machine Learning?",opts:["Pandas","NumPy","Scikit-learn","Matplotlib"],c:2,exp:"Scikit-learn provides the standard machine learning algorithms in Python's data science stack."},
{item:"Data Science",q:"Which library is used for Visualization?",opts:["Pandas","Matplotlib","Scikit-learn","math"],c:1,exp:"Matplotlib is the go-to library for turning data into charts and plots."},

let order = [];
let idx = 0;
let answers = [];
let picked = null;
let audioCtx = null;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, duration, type, vol, delay){
  delay = delay || 0;
  try{
    const ctx = getCtx();
    const start = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.12, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration);
  }catch(e){}
}
function soundClick(){ beep(520, 0.07, 'square', 0.07); }
function soundCorrect(){ beep(880, 0.11, 'sine', 0.12); beep(1175, 0.14, 'sine', 0.1, 0.09); }
function soundWrong(){ beep(260, 0.09, 'sawtooth', 0.1); beep(160, 0.2, 'sawtooth', 0.1, 0.08); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const ITEM_CATEGORY = {
  "Python":"Python Fundamentals","Interpreter":"Python Fundamentals","Indentation":"Python Fundamentals",
  "Variable":"Python Fundamentals","Syntax error":"Python Fundamentals","Runtime error":"Python Fundamentals",
  "Loop":"Python Fundamentals","Boolean":"Python Fundamentals","Comparison operator":"Python Fundamentals",
  "Logical operator":"Python Fundamentals",
  "List":"Data Structures","Tuple":"Data Structures","Dictionary":"Data Structures","Set":"Data Structures",
  "String":"Data Structures","Indexing":"Data Structures",
  "NumPy":"Libraries","Pandas":"Libraries","Matplotlib":"Libraries","Seaborn":"Libraries","Scikit-learn":"Libraries",
  "Data Science":"Data Science",
  "Function":"Functions, Modules & Packages","Parameter":"Functions, Modules & Packages",
  "Argument":"Functions, Modules & Packages","Return statement":"Functions, Modules & Packages",
  "Module":"Functions, Modules & Packages","Package":"Functions, Modules & Packages",
  "Exception":"Exception Handling",
  "math module":"Math Module"
};
function categoryFor(q){
  if(/^Predict the (output|result)/.test(q.q)) return "Output Prediction";
  return ITEM_CATEGORY[q.item] || "Python Fundamentals";
}
function arrangeNoAdjacentSameCat(list){
  const buckets = {};
  shuffle(list).forEach(entry => {
    (buckets[entry.cat] = buckets[entry.cat] || []).push(entry);
  });
  const result = [];
  let lastCat = null;
  let remaining = list.length;
  while(remaining > 0){
    let cats = Object.keys(buckets).filter(c => buckets[c].length > 0);
    let candidates = cats.filter(c => c !== lastCat);
    if(candidates.length === 0) candidates = cats;
    candidates.sort((a,b) => buckets[b].length - buckets[a].length);
    const chosenCat = candidates[0];
    const entry = buckets[chosenCat].shift();
    result.push(entry);
    lastCat = chosenCat;
    remaining--;
  }
  return result;
}

function startQuiz(){
  const byItem = {};
  QUESTIONS.forEach((q,i) => {
    if(!byItem[q.item]) byItem[q.item] = [];
    byItem[q.item].push(i);
  });
  const picks = ITEMS.map(it => {
    const options = byItem[it] || [];
    return options[Math.floor(Math.random()*options.length)];
  }).filter(v => v !== undefined);
  const tagged = picks.map(qi => ({qIndex: qi, cat: categoryFor(QUESTIONS[qi])}));
  const arranged = arrangeNoAdjacentSameCat(tagged);
  order = arranged.map(e => e.qIndex);
  idx = 0;
  answers = [];
  renderQuiz();
}

function renderQuiz(){
  if(idx >= order.length){ renderReport(); return; }
  picked = null;
  const q = QUESTIONS[order[idx]];
  const pct = Math.round((idx/order.length)*100);
  document.getElementById('app').innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left"><span class="badge busy"></span><span class="toolbar-title">python_basics.ipynb</span></div>
      <div class="toolbar-right">kernel: busy</div>
    </div>
    <div class="notebook">
      <div class="quiz-col">
        <div class="progress-row">
          <span class="progress-txt">cell ${idx+1} / ${order.length}</span>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="cell-in">In [${idx+1}]:</div>
        <div class="question">${q.q}</div>
        <div class="options" id="opts">
          ${q.opts.map((o,i)=>`<button class="option" data-i="${i}" onclick="pickOption(${i})"><span class="idx">${String.fromCharCode(65+i)}.</span>${o}</button>`).join('')}
        </div>
        <div id="answerPanel"></div>
        <div class="next-row"><button class="next-btn" id="nextBtn" disabled onclick="soundClick();nextQuestion()">${idx+1===order.length ? 'Finish run' : 'Run next cell'}</button></div>
        <p class="credits">made by: Yparx1</p>
      </div>
    </div>
  `;
}

function pickOption(i){
  if(picked !== null) return;
  picked = i;
  const q = QUESTIONS[order[idx]];
  const correct = i === q.c;
  answers.push({qIndex: order[idx], picked: i, correct: correct});

  const buttons = document.querySelectorAll('#opts .option');
  buttons.forEach((b,bi) => {
    b.disabled = true;
    if(bi === i && correct) b.classList.add('picked-ok');
    else if(bi === i && !correct) b.classList.add('picked-bad');
    else if(bi === q.c) b.classList.add('reveal-ok');
  });

  const panel = document.getElementById('answerPanel');
  if(correct){
    soundCorrect();
    panel.innerHTML = `<div class="answer-panel ok"><div class="verdict">Correct — "${q.opts[q.c]}"</div><div class="why">${q.exp}</div></div>`;
  } else {
    soundWrong();
    panel.innerHTML = `<div class="answer-panel bad"><div class="verdict">Incorrect. You chose "${q.opts[i]}" — the right answer is "${q.opts[q.c]}"</div><div class="why">${q.exp}</div></div>`;
  }

  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  idx += 1;
  renderQuiz();
}

function renderReport(){
  const total = answers.length;
  const correctCount = answers.filter(a=>a.correct).length;
  const wrong = answers.filter(a=>!a.correct);

  const tracebacks = wrong.map(a => {
    const q = QUESTIONS[a.qIndex];
    return `
      <div class="traceback">
        <span class="tb-head">Traceback (most recent cell last):</span><br>
        <span class="tb-file">  File "python_basics.ipynb", concept "${q.item}"</span><br>
        <span class="tb-line">    &gt;&gt;&gt; ${q.q}</span><br>
        <span class="tb-line">    your answer: ${q.opts[a.picked]}</span><br>
        <span class="tb-err">AnswerError: "${q.opts[a.picked]}" is wrong. Correct answer: "${q.opts[q.c]}"</span>
        <span class="tb-why">why "${q.opts[a.picked]}" is incorrect: ${q.exp}</span>
      </div>
    `;
  }).join('');

  const masteryHtml = answers.map(a => {
    const q = QUESTIONS[a.qIndex];
    const cls = 'mastery-item ' + (a.correct ? 'full' : 'zero');
    return `<div class="${cls}"><span>${q.item}</span><span class="frac">${a.correct ? '1/1' : '0/1'}</span></div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="toolbar">
      <div class="toolbar-left"><span class="badge"></span><span class="toolbar-title">python_basics.ipynb</span></div>
      <div class="toolbar-right">kernel: restarted</div>
    </div>
    <div class="notebook">
      <div class="report">
        <h2>Session report</h2>
        <p class="sub">All ${total} cells executed. Kernel restarted and state cleared, as a fresh run would find it.</p>
        <div class="score-row">
          <div class="score-card ok"><div class="num">${correctCount}</div><div class="lbl">correct</div></div>
          <div class="score-card bad"><div class="num">${wrong.length}</div><div class="lbl">incorrect</div></div>
          <div class="score-card"><div class="num">${Math.round((correctCount/total)*100)}%</div><div class="lbl">accuracy</div></div>
        </div>

        <p class="section-lbl">Mastery by concept (${ITEMS.length} tracked)</p>
        <div class="mastery-grid">${masteryHtml}</div>

        <p class="section-lbl">${wrong.length ? 'Review of incorrect answers (' + wrong.length + ')' : 'No incorrect answers'}</p>
        ${wrong.length ? '<p style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;">Every question you missed, what you picked, the correct answer, and why.</p>' : ''}
        ${wrong.length ? tracebacks : '<p style="font-size:13.5px;color:var(--ink-soft);">Every cell executed without a mismatched answer.</p>'}

        <div class="restart-row">
          <button class="restart-btn" onclick="soundClick();startQuiz()">Restart kernel and run all</button>
        </div>
        <p class="credits">made by: Yparx1</p>
      </div>
    </div>
  `;
}
